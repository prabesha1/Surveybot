# Render Blueprint — one-click deploy (UI + Playwright on one URL)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ap-survey-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: /app/data
      # Optional: set ADMIN_KEY in Render dashboard to protect /api/completions
