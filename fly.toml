# Optional: deploy with Fly.io — `fly launch` then `fly deploy`
app = "ap-survey-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/config"
    timeout = "5s"

[env]
  ALLOWED_ORIGINS = "*"
